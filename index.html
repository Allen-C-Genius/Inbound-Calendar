<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발주입고 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F6F7FB; --surface:#FFFFFF; --surface-2:#EFF2F8; --ink:#11151D;
  --muted:#5C6677; --faint:#8A94A6; --border:#E4E9F1; --border-strong:#CFD6E4;
  --accent:#004BDE; --accent-ink:#003bb0; --accent-soft:#E7EDFF;
  --today:#FFF4D6; --today-line:#E0A800; --sun:#D64545; --sat:#2F6FEA;
  --good:#1E9E6A; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --r:12px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1016; --surface:#151A22; --surface-2:#1C232F; --ink:#E9EDF4;
    --muted:#9AA6B8; --faint:#6B7686; --border:#242C39; --border-strong:#33404F;
    --accent:#6E90F2; --accent-ink:#9CB4F7; --accent-soft:#18233F;
    --today:#2A2410; --today-line:#C9A227; --sun:#F07272; --sat:#88AAFF;
    --good:#39C08A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1016; --surface:#151A22; --surface-2:#1C232F; --ink:#E9EDF4;
  --muted:#9AA6B8; --faint:#6B7686; --border:#242C39; --border-strong:#33404F;
  --accent:#6E90F2; --accent-ink:#9CB4F7; --accent-soft:#18233F;
  --today:#2A2410; --today-line:#C9A227; --sun:#F07272; --sat:#88AAFF;
  --good:#39C08A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 56px}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hd h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.hd .sub{color:var(--muted);font-size:13px;margin-top:3px}
.hd .sub b{color:var(--accent);font-weight:600}
.hd-actions{display:flex;gap:8px;align-items:center}

/* buttons */
.btn{font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:9px;padding:8px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{padding:8px 10px}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:4px}
.monthnav .mlabel{min-width:118px;text-align:center;font-weight:600;font-size:15px}
.monthnav .mlabel small{display:block;color:var(--faint);font-weight:500;font-size:11px;margin-top:-2px}
.navbtn{border:none;background:transparent;color:var(--ink);width:30px;height:30px;border-radius:7px;
  cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
.navbtn:hover{background:var(--surface-2)}
.spacer{flex:1}
.field{position:relative}
.field input,.dropbtn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:9px;padding:8px 12px;min-width:170px}
.field input::placeholder{color:var(--faint)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.dropbtn{cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:space-between}
.dropbtn .cnt{color:var(--accent);font-weight:600}
.pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:11px;box-shadow:var(--shadow);padding:8px;
  width:max-content;min-width:160px;max-width:320px;max-height:340px;overflow:auto}
.pop label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.pop label:hover{background:var(--surface-2)}
.pop label input{flex:none;width:15px;height:15px;margin:0;accent-color:var(--accent)}
.pop .wname{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
.pop .dot{width:9px;height:9px;border-radius:50%;flex:none}
.pop .top{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:2px 6px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.pop .lnk{color:var(--accent);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}

/* summary */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px;min-width:96px}
.chip .k{color:var(--muted);font-size:11px;letter-spacing:.03em}
.chip .v{font-size:19px;font-weight:600;margin-top:1px}
.chip .v small{font-size:12px;color:var(--faint);font-weight:500}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--border)}
.dow div{padding:9px 10px;font-size:12px;font-weight:600;color:var(--muted);text-align:left}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;cursor:default;position:relative;overflow:hidden}
.cell:nth-child(7n){border-right:none}
.cell.oth{background:var(--surface-2);opacity:.6}
.cell.wknd .dnum{color:var(--sat)} .cell.sun .dnum{color:var(--sun)}
.cell.today{background:var(--today)}
.cell.today .dnum{color:var(--today-line)}
.cell.has{cursor:pointer}
.cell.has:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.chead{display:flex;align-items:center;justify-content:space-between}
.dnum{font-weight:600;font-size:13px}
.dcount{font-size:10.5px;color:#fff;background:var(--accent);border-radius:20px;padding:1px 7px;font-weight:600}
.evs{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.ev{font-size:12px;line-height:1.3;display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.ev .q{color:var(--accent-ink);font-weight:600;font-size:11px;flex:none}
.ev .nm{overflow:hidden;text-overflow:ellipsis}
.ev .wh{color:var(--muted);flex:none;font-size:11px;display:inline-flex;align-items:center;gap:3px}
.ev .wh i{width:7px;height:7px;border-radius:50%;display:inline-block}
.more{font-size:11px;color:var(--accent);font-weight:600;margin-top:1px}

/* empty */
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}

/* drop */
body.drag .cal{outline:3px dashed var(--accent);outline-offset:4px}
.drop-hint{position:fixed;inset:0;background:rgba(0,75,222,.08);display:none;place-items:center;z-index:60;pointer-events:none}
body.drag .drop-hint{display:grid}
.drop-hint span{background:var(--accent);color:#fff;padding:14px 24px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;z-index:70;align-items:flex-start;justify-content:center;padding:5vh 16px}
.ov.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow);
  width:min(920px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal .mh h3{margin:0;font-size:16px}
.modal .mh .msub{color:var(--muted);font-size:12px;margin-top:2px}
.modal .mb{overflow:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.02em}
td.num{text-align:right}
tr:hover td{background:var(--surface-2)}
.whtag{display:inline-flex;align-items:center;gap:5px}
.whtag i{width:8px;height:8px;border-radius:50%}
.x{border:none;background:var(--surface-2);color:var(--ink);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
.x:hover{background:var(--border-strong)}

/* footer */
.foot{margin-top:16px;color:var(--faint);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.badge-src{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--muted)}
.badge-src.live{color:var(--good);border-color:var(--good)}
.clink{color:var(--accent);cursor:pointer;font-weight:500;margin-left:auto}
.clink:hover{text-decoration:underline}
@media (max-width:640px){
  .cell{min-height:92px}
  .ev .wh span{display:none}
  .hd h1{font-size:19px}
}
</style>

<div class="wrap">
  <header class="hd">
    <div>
      <h1>발주입고 캘린더</h1>
      <div class="sub"><b>납품예정일</b> 기준으로 그날 입고되는 품목을 자동 배치합니다</div>
    </div>
    <div class="hd-actions">
      <button class="btn" id="themeBtn" title="테마 전환">◐ 테마</button>
      <button class="btn primary" id="upBtn">⬆ 엑셀 업로드</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" multiple hidden>
    </div>
  </header>

  <div class="bar">
    <div class="monthnav">
      <button class="navbtn" id="prev" aria-label="이전 달">‹</button>
      <div class="mlabel" id="mlabel">—</div>
      <button class="navbtn" id="next" aria-label="다음 달">›</button>
    </div>
    <button class="btn" id="todayBtn">오늘</button>
    <div class="spacer"></div>
    <div class="field" id="whWrap">
      <button class="dropbtn" id="whBtn">창고: <span class="cnt" id="whCnt">전체</span> ▾</button>
    </div>
    <div class="field">
      <input id="q" type="text" placeholder="거래처·품목 검색">
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="cal">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="foot">
    <span class="badge-src" id="srcBadge">샘플 데이터</span>
    <span id="rangeInfo"></span>
    <span id="upInfo"></span>
    <span class="clink" id="clearBtn" hidden>누적 데이터 초기화</span>
  </div>
</div>

<div class="drop-hint"><span>여기에 K-System 엑셀 파일을 놓으세요</span></div>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mh">
      <div><h3 id="mTitle">—</h3><div class="msub" id="mSub"></div></div>
      <button class="x" id="mClose" aria-label="닫기">✕</button>
    </div>
    <div class="mb">
      <table id="mTable"></table>
    </div>
  </div>
</div>

          g.__n=0;g.__ven={};g.__qty=0;g.__mi=0;g.__amt=0;g.__vat=0;g.__tot=0;bc[k]=g;out.push(g);}
        g.__n++; if(r['구매거래처'])g.__ven[r['구매거래처']]=1;
        g.__qty+=(+r['발주수량']||0);g.__mi+=(+r['미납수량']||0);g.__amt+=(+r['발주원화금액']||0);
        g.__vat+=(+r['원화부가세']||0);g.__tot+=(+r['원화금액계']||0);
      } else { var rr=r; if(r['창고']&&/창고$/.test(String(r['창고']))){rr=Object.assign({},r);rr['창고']=stripWh(r['창고']);} out.push(rr); }
    });
    Object.keys(bc).forEach(function(k){var g=bc[k];
      g['발주수량']=g.__qty;g['미납수량']=g.__mi;g['발주원화금액']=g.__amt;g['원화부가세']=g.__vat;g['원화금액계']=g.__tot;
      var vs=Object.keys(g.__ven);g['구매거래처']=vs.length<=1?(vs[0]||g['구매거래처']):(vs[0]+' 외 '+(vs.length-1));
      g['발주품목규격']='통합 '+g.__n+'종'; g['창고']=stripWh(g['창고']);
      delete g.__n;delete g.__ven;delete g.__qty;delete g.__mi;delete g.__amt;delete g.__vat;delete g.__tot;});
    return out;
  }
  function rowKey(r){return [r['발주일'],r['납품예정일'],r['구매거래처'],r['발주품목'],r['발주품목규격'],r['발주수량'],r['창고']].join('|');}
  function mergeRaw(base, inc){var map={};base.forEach(function(r){map[rowKey(r)]=r;});inc.forEach(function(r){map[rowKey(r)]=r;});return Object.keys(map).map(function(k){return map[k];});}
  function refresh(){DATA=transform(RAW);}

  // ===== 서버 저장소(db): 모든 접속자가 같은 최신 데이터를 봄 =====
  var CH=400, DB=null, DBTried=false;
  async function getDB(){ if(DBTried) return DB; DBTried=true; try{ DB=(window.claude&&claude.use)?await claude.use('db'):null; }catch(e){ DB=null; } return DB; }
  async function loadFromDB(){
    var db=await getDB(); if(!db) return false;
    try{
      var ms=await db.doc('meta/current').get();
      if(!ms||!ms.exists) return false;
      var m=ms.data()||{}; var k=m.chunks||0, rows=[];
      for(var i=0;i<k;i++){ var cs=await db.doc('chunks/'+i).get(); if(cs&&cs.exists){var d=cs.data(); if(d&&d.rows) rows=rows.concat(d.rows);} }
      RAW=rows; SRC='db'; UPAT=m.at?new Date(m.at).toLocaleString('ko-KR'):''; FILES=m.files||[];
      refresh(); return true;
    }catch(e){ return false; }
  }
  async function saveToDB(rows, files){
    var db=await getDB(); if(!db) return {ok:false, reason:'unavailable'};
    try{
      var k=Math.ceil(rows.length/CH)||0, oldk=0;
      try{var mm=await db.doc('meta/current').get(); if(mm.exists){var md=mm.data(); if(md)oldk=md.chunks||0;}}catch(e){}
      for(var i=0;i<k;i++){ await db.doc('chunks/'+i).set({rows:rows.slice(i*CH,(i+1)*CH)}); }
      for(var j=k;j<oldk;j++){ try{await db.doc('chunks/'+j).delete();}catch(e){} }
      await db.doc('meta/current').set({chunks:k, n:rows.length, at:new Date().toISOString(), files:files||[]});
      return {ok:true};
    }catch(e){ return {ok:false, reason:(e&&e.code)||'error'}; }
  }
  async function watchDB(){
    var db=await getDB(); if(!db) return;
    try{ db.doc('meta/current').onSnapshot(function(s){ if(s&&s.exists){ loadFromDB().then(function(ok){ if(ok){ render(); } }); } }, function(){}); }catch(e){}
  }
  loadInitial(); refresh();

  function pad(n){return (n<10?'0':'')+n;}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function parseDate(v){ // returns 'YYYY-MM-DD' or ''
    if(v==null||v==='')return '';
    if(v instanceof Date && !isNaN(v))return ymd(v);
    if(typeof v==='number'){ // excel serial
      var d=new Date(Math.round((v-25569)*86400*1000)); if(!isNaN(d))return ymd(new Date(d.getTime()+d.getTimezoneOffset()*60000));
    }
    var s=String(v).trim();
    var m=s.match(/(\d{4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
    if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
    var d2=new Date(s); if(!isNaN(d2))return ymd(d2);
    return '';
  }
  function num(v){ if(v==null||v==='')return null; var n=Number(String(v).replace(/[, ]/g,'')); return isNaN(n)?null:n; }

  // color per warehouse (stable by sorted order)
  var whColorMap={};
  function buildWhColors(){
    whColorMap={};
    var whs=Array.from(new Set(DATA.map(function(r){return r['창고']||'미지정';}))).sort();
    whs.forEach(function(w,i){whColorMap[w]=WH_COLORS[i%WH_COLORS.length];});
  }
  function whColor(w){return whColorMap[w||'미지정']||'#888';}

  // state
  var view={y:0,m:0}, whSel=new Set(), q='';

  function monthKey(y,m){return y+'-'+pad(m+1);}
  function rowsWithDate(){return DATA.filter(function(r){return r['납품예정일'];});}
  function pickDefaultMonth(){
    var cnt={}; rowsWithDate().forEach(function(r){var k=r['납품예정일'].slice(0,7);cnt[k]=(cnt[k]||0)+1;});
    var keys=Object.keys(cnt); if(!keys.length){var t=new Date();return {y:t.getFullYear(),m:t.getMonth()};}
    var best=keys.sort(function(a,b){return cnt[b]-cnt[a];})[0];
    return {y:+best.slice(0,4),m:+best.slice(5,7)-1};
  }

  function passFilter(r){
    if(whSel.size && !whSel.has(r['창고']||'미지정'))return false;
    if(q){var s=((r['구매거래처']||'')+' '+(r['발주품목']||'')+' '+(r['발주품목규격']||'')).toLowerCase();if(s.indexOf(q)<0)return false;}
    return true;
  }
  function monthRows(){
    var mk=monthKey(view.y,view.m);
    return rowsWithDate().filter(function(r){return r['납품예정일'].slice(0,7)===mk && passFilter(r);});
  }

  var fmtWon=new Intl.NumberFormat('ko-KR');
  function fmtQty(n){return n==null?'':fmtWon.format(n);}

  function render(){
    buildWhColors();
    document.getElementById('mlabel').innerHTML=view.y+'년 '+(view.m+1)+'월<small>납품예정 기준</small>';
    // summary
    var mr=monthRows();
    var uItem=new Set(),uVen=new Set(),uWh=new Set(),sumWon=0;
    mr.forEach(function(r){uItem.add(r['발주품목']);uVen.add(r['구매거래처']);uWh.add(r['창고']);sumWon+=(r['원화금액계']||r['발주원화금액']||0)||0;});
    var chips=[['입고 건수',mr.length,''],['품목',uItem.size,'종'],['거래처',uVen.size,'곳'],['창고',uWh.size,'곳'],['금액계','₩'+fmtWon.format(Math.round(sumWon)),'']];
    document.getElementById('chips').innerHTML=chips.map(function(c){
      return '<div class="chip"><div class="k">'+c[0]+'</div><div class="v mono">'+c[1]+(c[2]?' <small>'+c[2]+'</small>':'')+'</div></div>';
    }).join('');

    // grid
    var first=new Date(view.y,view.m,1), start=new Date(first); start.setDate(1-first.getDay());
    var byDay={}; mr.forEach(function(r){(byDay[r['납품예정일']]=byDay[r['납품예정일']]||[]).push(r);});
    var todayStr=ymd(new Date());
    var g=document.getElementById('grid'); g.innerHTML='';
    var cells=[]; var d=new Date(start);
    // number of weeks: until we've passed the month end and completed a week
    for(var w=0;w<6;w++){
      for(var i=0;i<7;i++){
        var ds=ymd(d), oth=d.getMonth()!==view.m, dow=d.getDay();
        var evs=(byDay[ds]||[]);
        var cls='cell'+(oth?' oth':'')+(dow===0?' sun':(dow===6?' wknd':''))+(ds===todayStr?' today':'')+(evs.length?' has':'');
        var inner='<div class="chead"><span class="dnum">'+d.getDate()+'</span>'+(evs.length?'<span class="dcount mono">'+evs.length+'</span>':'')+'</div>';
        if(evs.length){
          var show=evs.slice(0,4);
          inner+='<div class="evs">'+show.map(function(r){
            return '<div class="ev"><span class="q mono">'+fmtQty(r['발주수량'])+'</span><span class="nm">'+esc(r['발주품목'])+'</span><span class="wh"><i style="background:'+whColor(r['창고'])+'"></i><span>'+esc(r['창고']||'')+'</span></span></div>';
          }).join('')+'</div>';
          if(evs.length>4)inner+='<div class="more">+'+(evs.length-4)+'건 더보기</div>';
        }
        var cell=document.createElement('div'); cell.className=cls; cell.innerHTML=inner;
        if(evs.length){cell.addEventListener('click',(function(dd,ee){return function(){openDay(dd,ee);};})(ds,evs));}
        g.appendChild(cell);
        d.setDate(d.getDate()+1);
      }
      if(d.getMonth()!==view.m && d.getDay()===0) break;
    }
    // range/footer
    var all=rowsWithDate().map(function(r){return r['납품예정일'];}).sort();
    document.getElementById('rangeInfo').textContent=all.length?('데이터 기간 '+all[0]+' ~ '+all[all.length-1]+' · 총 '+DATA.length.toLocaleString()+'건'):'데이터 없음';
    var sb=document.getElementById('srcBadge'), cbn=document.getElementById('clearBtn'); cbn.hidden=true;
    var mset={};rowsWithDate().forEach(function(r){mset[r['납품예정일'].slice(0,7)]=1;});
    var minfo=(FILES.length?FILES.length+'개 파일 · ':'')+Object.keys(mset).length+'개월'+(UPAT?' · '+UPAT+' 반영':'');
    if(SRC==='db'){ sb.textContent='공용 데이터 (실시간)'; sb.className='badge-src live'; document.getElementById('upInfo').textContent=minfo; }
    else if(SRC==='upload'){ sb.textContent='이 화면에만 반영됨'; sb.className='badge-src'; document.getElementById('upInfo').textContent=minfo+' · 공용 저장 안 됨'; }
    else if(SRC==='embed'){ sb.textContent='기본 데이터'; sb.className='badge-src'; document.getElementById('upInfo').textContent=minfo; }
    else{ sb.textContent='샘플 데이터'; sb.className='badge-src'; document.getElementById('upInfo').textContent='엑셀 업로드 시 실제 데이터로 대체'; }
    var emp=document.getElementById('empty');
    if(!mr.length){emp.hidden=false;emp.innerHTML='<b>'+(view.y)+'년 '+(view.m+1)+'월</b>에 표시할 입고 예정이 없습니다. 위 화살표로 다른 달을 보거나 필터를 확인하세요.';}
    else emp.hidden=true;
    renderWhPop();
  }

  function esc(s){s=(s==null?'':String(s));return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // day modal
  function openDay(ds,evs){
    evs=evs.slice().sort(function(a,b){return (a['창고']||'').localeCompare(b['창고']||'');});
    document.getElementById('mTitle').textContent=ds.replace(/-/g,'.')+' 입고 예정';
    var tq=0; evs.forEach(function(r){tq+=(r['발주수량']||0)||0;});
    document.getElementById('mSub').textContent=evs.length+'건 · 총 발주수량 '+fmtWon.format(tq);
    var cols=[['구매거래처','거래처'],['발주품목','품목'],['발주품목규격','규격'],['발주수량','수량',1],['미납수량','미납',1],['구매단위','단위'],['창고','창고'],['원화단가','단가',1],['원화금액계','금액계',1],['납품일','납품일']];
    var html='<thead><tr>'+cols.map(function(c){return '<th'+(c[2]?' class="num"':'')+'>'+c[1]+'</th>';}).join('')+'</tr></thead><tbody>';
    evs.forEach(function(r){
      html+='<tr>'+cols.map(function(c){
        var v=r[c[0]];
        if(c[0]==='창고')return '<td><span class="whtag"><i style="background:'+whColor(v)+'"></i>'+esc(v||'')+'</span></td>';
        if(c[2])return '<td class="num mono">'+(v==null||v===''?'-':fmtWon.format(v))+'</td>';
        return '<td>'+esc(v==null||v===''?'-':v)+'</td>';
      }).join('')+'</tr>';
    });
    html+='</tbody>';
    document.getElementById('mTable').innerHTML=html;
    document.getElementById('ov').classList.add('on');
  }
  function closeModal(){document.getElementById('ov').classList.remove('on');}

  // warehouse popover
  function renderWhPop(){
    var whs=Array.from(new Set(DATA.map(function(r){return r['창고']||'미지정';}))).sort();
    document.getElementById('whCnt').textContent=whSel.size?whSel.size+'개':'전체';
    var wrap=document.getElementById('whWrap'); var pop=wrap.querySelector('.pop');
    if(!pop){pop=document.createElement('div');pop.className='pop';pop.hidden=true;wrap.appendChild(pop);}
    pop.innerHTML='<div class="top"><span class="lnk" data-a="all">전체선택</span><span class="lnk" data-a="none">해제</span></div>'+
      whs.map(function(w){var on=whSel.size===0||whSel.has(w);return '<label><input type="checkbox" data-w="'+esc(w)+'" '+(whSel.has(w)?'checked':'')+'><span class="dot" style="background:'+whColor(w)+'"></span><span class="wname">'+esc(w)+'</span></label>';}).join('');
    pop.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change',function(){var w=cb.getAttribute('data-w');if(cb.checked)whSel.add(w);else whSel.delete(w);render();});
    });
    pop.querySelectorAll('.lnk').forEach(function(l){l.addEventListener('click',function(){if(l.getAttribute('data-a')==='all')whSel=new Set(whs);else whSel.clear();render();});});
  }
  function toggleWhPop(){var p=document.querySelector('#whWrap .pop');if(p)p.hidden=!p.hidden;}
  document.addEventListener('click',function(e){var w=document.getElementById('whWrap');var p=w.querySelector('.pop');if(p&&!p.hidden&&!w.contains(e.target))p.hidden=true;});

  // upload (여러 파일 동시 + 기존 누적에 추가)
  function normRows(rows){
    return rows.map(function(r){
      var o={};Object.keys(r).forEach(function(k){var kk=String(k).replace(/\s/g,'');kk=ALIAS[kk]||kk;o[kk]=r[k];});
      var out={};FIELDS.forEach(function(fld){out[fld]=o[fld]!=null?o[fld]:null;});
      out['납품예정일']=parseDate(o['납품예정일']);out['발주일']=parseDate(o['발주일']);out['납품일']=parseDate(o['납품일']);
      ['발주수량','미납수량','원화단가','발주원화금액','원화부가세','원화금액계'].forEach(function(nf){out[nf]=num(o[nf]);});
      return out;
    }).filter(function(r){return r['발주품목']||r['납품예정일'];});
  }
  function parseFile(f){return new Promise(function(res){
    var rd=new FileReader();
    rd.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});var ws=wb.Sheets[wb.SheetNames[0]];res(normRows(XLSX.utils.sheet_to_json(ws,{defval:null,raw:true})));}catch(e){res([]);}};
    rd.onerror=function(){res([]);};
    rd.readAsArrayBuffer(f);
  });}
  function handleFiles(list){
    var files=Array.prototype.slice.call(list); if(!files.length)return;
    Promise.all(files.map(parseFile)).then(function(results){
      var all=[]; results.forEach(function(a){all=all.concat(a);});
      if(!all.length){alert('인식할 수 있는 행을 찾지 못했습니다. 헤더(납품예정일·발주품목·창고 등)를 확인해 주세요.');return;}
      // 같은 '발주일 월'을 다시 올리면 그 월만 교체, 아니면 기존 데이터에 누적.
      var nm={}; all.forEach(function(r){if(r['발주일'])nm[r['발주일'].slice(0,7)]=1;});
      var base=(SRC!=='sample')?RAW.filter(function(r){return !(r['발주일']&&nm[r['발주일'].slice(0,7)]);}):[];
      RAW=base.concat(all); UPAT=new Date().toLocaleString('ko-KR');
      files.forEach(function(f){if(FILES.indexOf(f.name)<0)FILES.push(f.name);});
      whSel.clear(); SRC='db'; refresh(); view=pickDefaultMonth(); render();
      // 공용 저장소에 저장 → 링크 공유받은 사람 모두에게 반영
      saveToDB(RAW, FILES).then(function(res){
        if(!res.ok){
          SRC='upload'; render();
          alert(res.reason==='unavailable'
            ? '공용 저장소에 연결되지 않아 이 화면에만 반영됐습니다. 잠시 후 다시 시도해 주세요.'
            : '공용 저장 권한이 없어 이 화면에만 반영됐습니다. (편집 권한이 있는 계정에서 업로드해야 모두에게 반영됩니다)');
        }
      });
    });
  }
  function clearData(){}

  // events
  document.getElementById('upBtn').addEventListener('click',function(){document.getElementById('file').click();});
  document.getElementById('file').addEventListener('change',function(e){handleFiles(e.target.files);e.target.value='';});
  document.getElementById('clearBtn').addEventListener('click',clearData);
  document.getElementById('prev').addEventListener('click',function(){view.m--;if(view.m<0){view.m=11;view.y--;}render();});
  document.getElementById('next').addEventListener('click',function(){view.m++;if(view.m>11){view.m=0;view.y++;}render();});
  document.getElementById('todayBtn').addEventListener('click',function(){var t=new Date();view={y:t.getFullYear(),m:t.getMonth()};render();});
  document.getElementById('whBtn').addEventListener('click',function(e){e.stopPropagation();toggleWhPop();});
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();render();});
  document.getElementById('mClose').addEventListener('click',closeModal);
  document.getElementById('ov').addEventListener('click',function(e){if(e.target.id==='ov')closeModal();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  // theme toggle
  document.getElementById('themeBtn').addEventListener('click',function(){
    var r=document.documentElement, cur=r.getAttribute('data-theme');
    var dark=cur? cur==='dark' : window.matchMedia('(prefers-color-scheme:dark)').matches;
    r.setAttribute('data-theme',dark?'light':'dark');
  });
  // drag drop
  var dc=0;
  window.addEventListener('dragenter',function(e){e.preventDefault();dc++;document.body.classList.add('drag');});
  window.addEventListener('dragover',function(e){e.preventDefault();});
  window.addEventListener('dragleave',function(e){dc--;if(dc<=0)document.body.classList.remove('drag');});
  window.addEventListener('drop',function(e){e.preventDefault();dc=0;document.body.classList.remove('drag');if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});

  view=pickDefaultMonth();
  render();
  // 서버에 저장된 최신 데이터가 있으면 불러와 덮어쓰고, 이후 변경을 실시간 반영
  (async function(){
    var ok=await loadFromDB();
    if(ok){ view=pickDefaultMonth(); render(); }
    watchDB();
  })();
})();
</script>
